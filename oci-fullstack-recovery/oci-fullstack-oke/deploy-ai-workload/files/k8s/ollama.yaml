apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-data
  namespace: ai-fsdr-lab
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ai-fsdr-lab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          image: docker.io/ollama/ollama:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              ollama serve &
              server_pid=$!
              trap 'kill "$server_pid" 2>/dev/null || true' TERM INT
              until ollama list >/dev/null 2>&1; do sleep 2; done
              if ! ollama show "$OLLAMA_MODEL" >/dev/null 2>&1; then
                ollama pull "$OLLAMA_MODEL"
              fi
              wait "$server_pid"
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            - name: OLLAMA_MODEL
              value: "qwen2.5:0.5b"
            - name: OLLAMA_KEEP_ALIVE
              value: "24h"
          ports:
            - name: http
              containerPort: 11434
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          volumeMounts:
            - name: data
              mountPath: /root/.ollama
          startupProbe:
            exec:
              command: ["/bin/sh", "-c", "ollama show \"$OLLAMA_MODEL\" >/dev/null 2>&1"]
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /api/tags
              port: http
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/tags
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ollama-data
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: ai-fsdr-lab
spec:
  selector:
    app: ollama
  ports:
    - name: http
      port: 11434
      targetPort: http
